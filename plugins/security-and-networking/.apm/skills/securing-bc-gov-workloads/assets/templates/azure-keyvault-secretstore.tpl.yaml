# gitops/charts/<app>/templates/azure-keyvault-secretstore.yaml
# Non-expiring ESO pattern using an Azure Service Principal (exempt from MFA,
# requested via ADMS with 'get' and 'list' Secret permissions).
# Prerequisite:
#   oc create secret generic azure-key-vault-creds \
#     --from-literal=clientId=${CLIENT_ID} \
#     --from-literal=clientSecret=${CLIENT_SECRET} \
#     --from-literal=tenantId=${TENANT_ID}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
  namespace: {{ .Values.namespace }}
spec:
  provider:
    azurekv:
      vaultUrl: "https://{{ .Values.azureKeyVaultName }}.vault.azure.net/"
      authSecretRef:
        clientId:
          name: azure-key-vault-creds
          key: clientId
        clientSecret:
          name: azure-key-vault-creds
          key: clientSecret
        tenantId:
          name: azure-key-vault-creds
          key: tenantId
