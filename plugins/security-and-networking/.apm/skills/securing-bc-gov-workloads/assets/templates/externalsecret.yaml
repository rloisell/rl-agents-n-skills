# gitops/charts/<app>/templates/externalsecret.yaml
# NOTE: SecretStore.spec.provider.vault.path already targets
# <license-plate>-nonprod or <license-plate>-prod.
# Avoid hyphens in Vault secret property keys (use underscores) to prevent
# template/vault-init parsing issues.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: app-secrets
        property: db_password
    - secretKey: connection-string
      remoteRef:
        key: app-secrets
        property: connection_string
