# gitops/charts/<app>/templates/secretstore.yaml
# NOTE: BC Gov Private Cloud Vault uses OIDC, so ESO requires a manually
# generated token (expires after 1 month) stored in `eso-vault-creds`.
# For KSA-based non-expiring auth with BC Gov Vault, use vault-agent-injector.tpl.yaml.
# For non-expiring ESO sync, use azure-keyvault-secretstore.tpl.yaml or AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secretstore
  namespace: {{ .Values.namespace }}
spec:
  provider:
    vault:
      server: "https://vault.developer.gov.bc.ca"
      namespace: platform-services
      # KV v2 engine provisioned by Platform Product Registry:
      # <license-plate>-nonprod (dev/test/tools) or <license-plate>-prod (prod)
      path: "{{ .Values.licenseplate }}-{{ .Values.vaultEngine }}"
      version: "v2"
      auth:
        tokenSecretRef:
          name: eso-vault-creds
          key: token
