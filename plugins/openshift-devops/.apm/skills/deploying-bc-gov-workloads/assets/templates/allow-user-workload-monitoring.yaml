# Allow OpenShift User Workload Monitoring (Prometheus) to scrape /metrics endpoints.
# Note: If enforcing Conftest network-policies.rego, replace `podSelector: {}` with
# `podSelector.matchLabels` targeting the specific metrics-exposing pods and add `ports`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-openshift-monitoring
  namespace: @@LICENSE_PLATE@@-@@ENV@@
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
